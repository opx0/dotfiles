[metadata]
name = "zsh-history"
description = "A channel to select from your zsh history"
requirements = ["zsh"]

[source]
# HISTFILE is set but not exported by .zshrc, so a subshell will not inherit it;
# point at the XDG path this setup actually uses, with the default as fallback.
command = "sed '1!G;h;$!d' ${HISTFILE:-${HOME}/.local/state/zsh/history}"
display = "{split:;:1..}"
output = "{split:;:1..}"
no_sort = true
frecency = false

[actions.execute]
description = "Execute the selected command"
command = "zsh -c '{split:;:1..}'"
mode = "execute"
