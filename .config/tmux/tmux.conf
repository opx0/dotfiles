source-file ~/.config/tmux/tmux.reset.conf

# ────────────────────────────────────────────────────────────
# THEME — uncomment ONE, comment the other, then prefix + I
# ────────────────────────────────────────────────────────────
#source-file ~/.config/tmux/themes/catppuccin.conf       # ← DEV (default)
 source-file ~/.config/tmux/themes/tokyo-night.conf    #alt

set-option -g default-terminal 'tmux-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

set -g extended-keys on

set -g prefix ^A
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g pane-base-index 1         # start indexing panes at 1 instead of 0
setw -g pane-base-index 1
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 100000      # 50x tmux default; safe on tiny VPSes
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position bottom
set -g status-interval 5         # status bar refresh interval (default 15s)
set -g mouse on                  # enable mouse selection / scroll / resize
set -g focus-events on           # propagate terminal focus events (nvim autoread, FocusGained)
setw -g mode-keys vi

# Terminal window title reflects current tmux pane
set-option -g set-titles on
set-option -g set-titles-string "#T"

# No-prefix pane navigation
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# No-prefix window navigation
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n M-H previous-window
bind -n M-L next-window

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'

set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-bind 'o'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'

set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

run '~/.tmux/plugins/tpm/tpm'

# Per-host overrides (optional escape hatch — create ~/.tmux.local.conf
# on a host to override anything above, e.g. tiny VPS: history-limit 20000)
if-shell '[ -f ~/.tmux.local.conf ]' 'source-file ~/.tmux.local.conf'
