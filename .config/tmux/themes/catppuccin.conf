# Catppuccin theme (v2.3.0+)
# https://github.com/catppuccin/tmux

set -g @plugin 'catppuccin/tmux#v2.3.0'

# Theme options — must be set BEFORE running catppuccin.tmux
set -g @catppuccin_flavor 'mocha'                  # latte | frappe | macchiato | mocha
set -g @catppuccin_window_status_style 'rounded'   # basic | rounded | slanted | custom | none
set -g @catppuccin_window_flags 'icon'             # none | icon | text — shows zoom/sync flags

# Directory module shows just the basename
set -g @catppuccin_directory_text "#{b:pane_current_path}"

# Pane borders
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# Load catppuccin — no-op on fresh install until TPM has cloned it
if-shell '[ -f ~/.tmux/plugins/tmux/catppuccin.tmux ]' \
  "run '~/.tmux/plugins/tmux/catppuccin.tmux'"

# Status bar layout (after catppuccin defines the module variables)
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"
